<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AE Operations — local preview</title>
<style>
  body { margin: 0; padding: 20px; background: #eef1f4; font-family: Arial, sans-serif; }
  h2 { font-family: Arial, sans-serif; color: #333; }
  com-porticobenefits-aeoperations { display: block; width: 900px; height: 900px; }
</style>
</head>
<body>
<h2>AE Operations — standalone preview (mock data, exercises the real SAC widget lifecycle hooks)</h2>
<com-porticobenefits-aeoperations id="widget"></com-porticobenefits-aeoperations>

<script src="main.js"></script>
<script>
  // Drive the widget the same way SAC would: call the lifecycle hooks with
  // changedProperties. Since the mock data is already baked into main.js as
  // defaults, this just confirms the update path itself works without
  // errors -- swap these calls out for real bound data once available.
  const widget = document.getElementById("widget");
  widget.onCustomWidgetBeforeUpdate({ width: 900, height: 900, asOfLabel: "Preview — mock data" });
  widget.onCustomWidgetAfterUpdate({ width: 900, height: 900, asOfLabel: "Preview — mock data" });
</script>
</body>
</html>
